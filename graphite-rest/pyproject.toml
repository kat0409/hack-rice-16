[project]
name = "graphite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastembed>=0.4",
    "faster-whisper>=1.2.1",
    "google-genai>=0.8",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed as a package, so the source tree has to be made
# importable for tests the same way `python -m graphite.ingest` does. Without
# this every test fails to collect with "No module named 'graphite'".
pythonpath = ["."]
